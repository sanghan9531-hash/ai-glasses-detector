# 플레이스토어 출시용 앱 번들(AAB)을 만든다.
# Actions 탭 → Build Release AAB (Play Store) → Run workflow 로 직접 실행한다.
# 필요한 GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD
name: Build Release AAB (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::GitHub Secrets에 KEYSTORE_BASE64, KEYSTORE_PASSWORD를 먼저 등록하십시오."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packages
        run: npm install

      - name: Copy web app
        run: |
          mkdir -p www
          cp ../index.html www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

      - name: Create Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build signed AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab ../EyeCatch-${{ inputs.version_name }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EyeCatch-release-${{ inputs.version_name }}-build${{ github.run_number }}
          path: android-app/EyeCatch-${{ inputs.version_name }}.aab
          retention-days: 30
