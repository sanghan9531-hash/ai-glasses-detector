name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check code
        run: python -m py_compile ai_glasses_detector_app.py

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name AIGlassesDetector
          --collect-submodules bleak
          --collect-all winrt
          ai_glasses_detector_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIGlassesDetector-windows
          path: dist/AIGlassesDetector.exe
